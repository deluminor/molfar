<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="tile" x1="0.22" y1="0" x2="0.78" y2="1">
      <stop offset="0" stop-color="#0a111b"/>
      <stop offset="1" stop-color="#05080e"/>
    </linearGradient>
    <radialGradient id="aura" cx="512" cy="512" r="290" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2ab4d8" stop-opacity="0.15"/>
      <stop offset="0.55" stop-color="#147898" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#147898" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="512" cy="512" r="138" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e8faff" stop-opacity="0.72"/>
      <stop offset="0.35" stop-color="#8adcf2" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#2a90b0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ad4f0" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#f5fcff" stop-opacity="1"/>
      <stop offset="1" stop-color="#7ad4f0" stop-opacity="0.7"/>
    </linearGradient>
    <radialGradient id="iris" cx="0.5" cy="0.5" r="0.68">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#dff6ff"/>
      <stop offset="1" stop-color="#5eb8d4"/>
    </radialGradient>
    <linearGradient id="cometNW" gradientUnits="userSpaceOnUse"
      x1="224.79" y1="583.61"
      x2="583.61" y2="224.79">
      <stop offset="0" stop-color="#7ad4f5" stop-opacity="0"/>
      <stop offset="0.22" stop-color="#8adcf5" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#b8ecff" stop-opacity="0.55"/>
      <stop offset="0.78" stop-color="#e0f7ff" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="cometSE" gradientUnits="userSpaceOnUse"
      x1="799.21" y1="440.39"
      x2="440.39" y2="799.21">
      <stop offset="0" stop-color="#7ad4f5" stop-opacity="0"/>
      <stop offset="0.22" stop-color="#8adcf5" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#b8ecff" stop-opacity="0.55"/>
      <stop offset="0.78" stop-color="#e0f7ff" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
    <filter id="lidSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="coreSoft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
    <filter id="orbitGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="headGlow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <clipPath id="clip"><rect width="1024" height="1024" rx="228"/></clipPath>
  </defs>

  <rect width="1024" height="1024" rx="228" fill="url(#tile)"/>
  <g clip-path="url(#clip)">
    <rect width="1024" height="1024" fill="url(#aura)"/>

    
    <!-- soft tail glow -->
    <path d="M 224.79 583.61 A 296 296 0 0 1 583.61 224.79" fill="none" stroke="#7ad4f5" stroke-width="6"
          opacity="0.1" stroke-linecap="round" filter="url(#orbitGlow)"/>
    <!-- body -->
    <path d="M 224.79 583.61 A 296 296 0 0 1 583.61 224.79" fill="none" stroke="url(#cometNW)" stroke-width="2.35"
          stroke-linecap="round"/>
    <!-- head bloom + core -->
    <circle cx="583.61" cy="224.79" r="14"
            fill="#9ae4ff" opacity="0.4" filter="url(#headGlow)"/>
    <circle cx="583.61" cy="224.79" r="6.2" fill="#eefbff"/>
    <circle cx="583.61" cy="224.79" r="2.6" fill="#ffffff"/>
    
    <!-- soft tail glow -->
    <path d="M 799.21 440.39 A 296 296 0 0 1 440.39 799.21" fill="none" stroke="#7ad4f5" stroke-width="6"
          opacity="0.1" stroke-linecap="round" filter="url(#orbitGlow)"/>
    <!-- body -->
    <path d="M 799.21 440.39 A 296 296 0 0 1 440.39 799.21" fill="none" stroke="url(#cometSE)" stroke-width="2.35"
          stroke-linecap="round"/>
    <!-- head bloom + core -->
    <circle cx="440.39" cy="799.21" r="14"
            fill="#9ae4ff" opacity="0.4" filter="url(#headGlow)"/>
    <circle cx="440.39" cy="799.21" r="6.2" fill="#eefbff"/>
    <circle cx="440.39" cy="799.21" r="2.6" fill="#ffffff"/>

    <circle cx="512" cy="512" r="138" fill="url(#coreGlow)"/>

    <!-- eye: one path only; soft bloom uses same path with round join (no tip caps) -->
    <path d="M 288 512
  C 355 398, 425 348, 512 348
  C 599 348, 669 398, 736 512
  C 669 626, 599 676, 512 676
  C 425 676, 355 626, 288 512 Z" fill="none" stroke="#8adcf5" stroke-width="12"
          opacity="0.12" stroke-linejoin="round" filter="url(#lidSoft)"/>
    <path d="M 288 512
  C 355 398, 425 348, 512 348
  C 599 348, 669 398, 736 512
  C 669 626, 599 676, 512 676
  C 425 676, 355 626, 288 512 Z" fill="none" stroke="url(#lid)" stroke-width="8.5"
          stroke-linejoin="round"/>

    <circle cx="512" cy="512" r="56" fill="#7ad4f0" opacity="0.22" filter="url(#coreSoft)"/>
    <circle cx="512" cy="512" r="46" fill="url(#iris)"/>
    <rect x="507" y="482" width="10" height="60" rx="5" fill="#071018" opacity="0.8"/>
  </g>
</svg>