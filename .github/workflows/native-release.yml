name: MOLFAR Native Packages

on:
  pull_request:
    paths:
      - 'crates/**'
      - 'vendor/gpui-pre*/**'
      - 'scripts/*native*'
      - 'scripts/native-release/**'
      - 'scripts/build-tools/**'
      - 'package.json'
      - '.github/workflows/native-release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: Native version (X.Y.Z-preview.N)
        required: true
        default: '0.16.0-preview.1'
        type: string
      publish:
        description: Publish a new Native prerelease from main
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: native-packages-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      distribution: ${{ steps.version.outputs.distribution }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: version
        env:
          VERSION: ${{ inputs.version || '0.16.0-preview.1' }}
          PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        run: |
          if [[ "$PUBLISH" == true && "$GITHUB_REF" != refs/heads/main ]]; then
            echo 'Native publication must run from main' >&2
            exit 1
          fi
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          import { nativeTag } from './scripts/native-release/github.mjs';
          nativeTag(process.env.VERSION);
          const distribution = process.env.PUBLISH === 'true' ? 'public' : 'validation';
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${process.env.VERSION}\ndistribution=${distribution}\n`);
          JS

  packages:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            kind: macos
            arch: aarch64
            target: aarch64-apple-darwin
          - os: macos-15-intel
            kind: macos
            arch: x86_64
            target: x86_64-apple-darwin
          - os: windows-2022
            kind: windows
            arch: x86_64
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            kind: linux
            arch: x86_64
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      MOLFAR_NATIVE_VERSION: ${{ needs.prepare.outputs.version }}
      MOLFAR_NATIVE_UPDATER_ENDPOINT: ''
      MOLFAR_NATIVE_UPDATER_PUBKEY: ''
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux build and package dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential clang cmake pkg-config libasound2-dev libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-randr0-dev libegl1-mesa-dev libvulkan-dev libdbus-1-dev libssl-dev libzstd-dev squashfs-tools rpm
          echo "APPIMAGETOOL=$(bash scripts/build-tools/appimagetool.sh)" >> "$GITHUB_ENV"
      - name: Install Windows packager
        if: runner.os == 'Windows'
        run: |
          choco install nsis --no-progress -y
          echo 'C:\Program Files (x86)\NSIS' >> "$GITHUB_PATH"
      - name: Check package tooling
        run: npm run native:test:dev
      - name: Build versioned native binary
        run: cargo build --locked --manifest-path crates/molfar-gpui/Cargo.toml -p molfar-gpui --release --target '${{ matrix.target }}'
      - name: Configure public macOS signing
        if: runner.os == 'macOS' && needs.prepare.outputs.distribution == 'public'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: bash scripts/native-release/apple-signing.sh
      - name: Package native binary
        env:
          KIND: ${{ matrix.kind }}
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
          DISTRIBUTION: ${{ needs.prepare.outputs.distribution }}
        run: |
          binary="crates/molfar-gpui/target/$TARGET/release/molfar-native"
          if [[ "$RUNNER_OS" == Windows ]]; then binary="$binary.exe"; fi
          node scripts/package-native.mjs "$KIND" "$binary" native-packages "$ARCH" "$DISTRIBUTION"
          if [[ "$KIND" == linux ]]; then
            node scripts/package-native.mjs rpm "$binary" native-packages "$ARCH" "$DISTRIBUTION"
          fi
      - name: Remove signing keychain
        if: always() && runner.os == 'macOS' && needs.prepare.outputs.distribution == 'public'
        run: |
          if [[ -f "$RUNNER_TEMP/native-signing.keychain-db" ]]; then security delete-keychain "$RUNNER_TEMP/native-signing.keychain-db"; fi
          rm -f "$RUNNER_TEMP/native-certificate.p12" "$RUNNER_TEMP/native-notary.p8"
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          if-no-files-found: error
          path: |
            native-packages/*.*
            !native-packages/work/**

  verify:
    needs: [prepare, packages]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: native-packages
      - run: node scripts/native-release/github.mjs native-packages "$VERSION" "$DISTRIBUTION"
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          DISTRIBUTION: ${{ needs.prepare.outputs.distribution }}
      - uses: actions/upload-artifact@v4
        with:
          name: verified-native-packages
          if-no-files-found: error
          path: native-packages/*

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: [prepare, verify]
    runs-on: ubuntu-22.04
    environment: native-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: verified-native-packages
          path: native-packages
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish native prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_PUBLISH: ${{ inputs.publish }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/native-release/publish.mjs native-packages "$VERSION" "$GITHUB_SHA"
